<h2 class="text-center">Create Customer</h2>

<div class="container">
    <div class="card">
        <h5 class="card-header text-center">
            Create Customer
        </h5>
        <div class="card-body form-group">
            <label for="">First Name</label>
            <input type="text" class="form-control" [(ngModel)]="customer.firstName">

            <label for="">Last Name</label>
            <input type="text" class="form-control" [(ngModel)]="customer.lastName">

            <label for="">Phone</label>
            <input type="text" class="form-control" [(ngModel)]="customer.phone">

            <label for="">Address</label>
            <input type="text" class="form-control" [(ngModel)]="customer.address">

            <label for="">Date of birth</label>
            <input type="date" class="form-control" [(ngModel)]="customer.dob">

            <label for="">SSN</label>
            <input type="text" class="form-control" [(ngModel)]="customer.ssn">

            <h4 class="mt-2">{{message}}</h4>

            @if(!!customerService.errors.length){
                <ul>
                    @for(err of customerService.errors; track err){
                        <li>{{err}}</li>
                    }
                </ul>
            }
        </div>
        <div class="card-footer">
            <button class="btn btn-success" (click)="createCustomer()">Create Customer</button>
        </div>
    </div>
</div>
